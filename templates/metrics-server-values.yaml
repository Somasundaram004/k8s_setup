replicas: 2

args:
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  # kubeadm clusters commonly use self-signed kubelet serving certificates.
  # Replace this with trusted kubelet CA configuration when available.
  - --kubelet-insecure-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi