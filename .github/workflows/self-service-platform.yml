name: self-service-platform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-platform:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Install all platform components
        run: ./scripts/install-platform-kit.sh
      - name: Verify platform components
        run: |
          kubectl get pods -n argocd
          kubectl get pods -n monitoring
          kubectl get pods -n kube-system -l app.kubernetes.io/name=metrics-server
          kubectl top nodes